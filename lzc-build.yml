manifest: ./lzc-manifest.yml
pkgout: ./
icon: ./icon.png
# 源码构建：上游 rustroot 是 Astro 静态站点（jimichenx/rustroot），
# 构建时内嵌上游源码快照（build/source.tar.gz，记录 SHA 于 build/SOURCE_SHA），
# 双语言分别构建后由 nginx 托管：/ → zh，/en/ → en。
# 说明：不在容器内 git clone —— 盒子构建网络不保证可达 github.com。
images:
  rustroot:
    dockerfile-content: |
      FROM node:22-alpine AS src
      WORKDIR /appsrc
      ADD source.tar.gz .
      RUN sh -c 'cd jimichenx-rustroot-* && mv * .[!.]* .. 2>/dev/null; cd .. && rmdir jimichenx-rustroot-*'

      FROM node:22-alpine AS build
      WORKDIR /app
      COPY --from=src /appsrc .
      RUN npm ci
      RUN npm run build

      FROM nginx:1.27-alpine AS runtime
      RUN apk add --no-cache wget
      COPY --from=build /app/dist/zh /usr/share/nginx/html/zh
      COPY --from=build /app/dist/en /usr/share/nginx/html/en
      COPY nginx.conf /etc/nginx/conf.d/default.conf
      EXPOSE 8080
      HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \
        CMD wget -q --spider http://127.0.0.1:8080/ || exit 1
    context: build